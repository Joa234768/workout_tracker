<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Self-check: running…</title>
  <link rel="icon" type="image/png" sizes="192x192" href="../../icons/icon-192.png">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/app.css">
</head>
<body>
  <!-- The same self-check as Settings → "Run database self-check", as a
       standalone page for the PC. On the phone, use the one in Settings. -->
  <header class="app-header"><h1>Self-check</h1></header>
  <main id="view"></main>
  <script type="module">
    import { renderSelfCheck } from '../../js/views/selfcheck.js';
    const ok = await renderSelfCheck(document.getElementById('view'), { fixtureUrl: '../fixtures/backup-v1.json' });
    document.title = ok ? 'Self-check: PASS' : 'Self-check: FAIL';
  </script>
</body>
</html>
