<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F6F6F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
  <title>Workout Tracker</title>

  <!-- Installed (home-screen) app -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="app-header">
    <a id="back-button" class="back-button" href="#/today" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 id="view-title">Today</h1>
  </header>

  <main id="view"></main>

  <div id="banners" class="banners" aria-live="polite"></div>

  <nav class="tabbar" aria-label="Main">
    <a href="#/today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Today</span>
    </a>
    <a href="#/calendar" data-tab="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>
      <span>Calendar</span>
    </a>
    <a href="#/progress" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg>
      <span>Progress</span>
    </a>
    <a href="#/exercises" data-tab="exercises">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="7" width="3.5" height="10" rx="1"/><rect x="15.5" y="7" width="3.5" height="10" rx="1"/><path d="M8.5 12h7M2.5 12H5M19 12h2.5"/></svg>
      <span>Exercises</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
